name: Build APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Prepare files
        run: |
          test -f index.html || { echo "index.html не найден в корне репозитория"; exit 1; }
          mkdir -p app/src/main/assets
          rsync -a --exclude='.git' --exclude='.github' --exclude='app' --exclude='google-services.json' ./ app/src/main/assets/

          ls -la app/src/main/assets

      - name: Generate Android Project
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # google-services.json: из репозитория или из секрета GOOGLE_SERVICES_JSON
          if [ ! -f google-services.json ] && [ -n "$GS_JSON" ]; then
            printf '%s' "$GS_JSON" > google-services.json
          fi
          if [ ! -f google-services.json ]; then
            echo "::error::google-services.json не найден. Без него в APK не работают уведомления. Скачайте его в Firebase Console (Android-приложение com.tulenchika.app) и положите в корень репозитория."
            exit 1
          fi
          if ! grep -q '"package_name": *"com.tulenchika.app"' google-services.json; then
            echo "::error::В google-services.json нет Android-приложения с package_name com.tulenchika.app. Добавьте его в Firebase Console и скачайте файл заново."
            exit 1
          fi
          HAS_FCM=true
          cp google-services.json app/google-services.json
          GMS_CLASSPATH="classpath 'com.google.gms:google-services:4.4.2'"

          echo 'rootProject.name = "ChatTulenchika"' > settings.gradle
          echo 'include ":app"' >> settings.gradle
          echo 'android.useAndroidX=true' > gradle.properties

          cat << EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  ${GMS_CLASSPATH}
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.tulenchika.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tulenchika.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      if (System.getenv("KS_PATH")) {
                          storeFile file(System.getenv("KS_PATH"))
                          storePassword System.getenv("KS_PASS")
                          keyAlias System.getenv("KS_ALIAS")
                          keyPassword System.getenv("KS_KEY_PASS")
                      }
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig System.getenv("KS_PATH") ? signingConfigs.release : signingConfigs.debug
                  }
              }
          }
          EOF

          if [ "$HAS_FCM" = "true" ]; then
            cat << 'EOF' >> app/build.gradle
          dependencies {
              implementation platform('com.google.firebase:firebase-bom:33.1.2')
              implementation 'com.google.firebase:firebase-messaging'
          }
          apply plugin: 'com.google.gms.google-services'
          EOF
            SERVICE_XML='<service android:name=".MyFirebaseService" android:exported="false"><intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT" /></intent-filter></service>'
          else
            SERVICE_XML=''
          fi

          ICON_SRC=""
          for f in icon.png B57414E5-0B7C-4480-8F05-23FEBE4F3E27.png; do
            if [ -f "$f" ]; then ICON_SRC="$f"; break; fi
          done
          if [ -n "$ICON_SRC" ]; then
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              dir="app/src/main/res/mipmap-${d%%:*}"; px="${d##*:}"
              mkdir -p "$dir"
              if command -v convert >/dev/null 2>&1; then
                convert "$ICON_SRC" -resize ${px}x${px} -background none -gravity center -extent ${px}x${px} "$dir/ic_launcher.png"
              else
                cp "$ICON_SRC" "$dir/ic_launcher.png"
              fi
            done
            ICON='@mipmap/ic_launcher'
            echo "Иконка приложения: $ICON_SRC"
          else
            ICON='@android:drawable/sym_def_app_icon'
            echo "::warning::Файл иконки не найден: стандартная иконка"
          fi

          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="true"
                  android:icon="${ICON}"
                  android:label="Чат Тюленчика"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <meta-data
                      android:name="com.google.firebase.messaging.default_notification_channel_id"
                      android:value="chat" />
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  ${SERVICE_XML}
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/java/com/tulenchika/app

          if [ "$HAS_FCM" = "true" ]; then
            cat << 'EOF' > app/src/main/java/com/tulenchika/app/FcmHelper.java
          package com.tulenchika.app;
          import com.google.firebase.messaging.FirebaseMessaging;
          public class FcmHelper {
              interface Cb { void done(String token, String err); }
              static void getToken(Cb cb) {
                  try {
                      FirebaseMessaging.getInstance().getToken().addOnCompleteListener(t -> {
                          if (t.isSuccessful() && t.getResult() != null) cb.done(t.getResult(), null);
                          else cb.done(null, t.getException() != null ? String.valueOf(t.getException().getMessage()) : "no token");
                      });
                  } catch (Throwable e) {
                      cb.done(null, String.valueOf(e.getMessage()));
                  }
              }
          }
          EOF

            cat << 'EOF' > app/src/main/java/com/tulenchika/app/MyFirebaseService.java
          package com.tulenchika.app;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.os.Build;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          public class MyFirebaseService extends FirebaseMessagingService {
              @Override
              public void onMessageReceived(RemoteMessage m) {
                  String title = "Чат Тюленчика";
                  String body = "";
                  RemoteMessage.Notification n = m.getNotification();
                  if (n != null) {
                      if (n.getTitle() != null) title = n.getTitle();
                      if (n.getBody() != null) body = n.getBody();
                  } else {
                      if (m.getData().get("title") != null) title = m.getData().get("title");
                      if (m.getData().get("body") != null) body = m.getData().get("body");
                  }
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(new NotificationChannel("chat", "Чат", NotificationManager.IMPORTANCE_HIGH));
                  }
                  Intent open = new Intent(this, MainActivity.class);
                  open.addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open,
                      PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26
                      ? new Notification.Builder(this, "chat")
                      : new Notification.Builder(this);
                  b.setSmallIcon(android.R.drawable.ic_dialog_info)
                   .setContentTitle(title)
                   .setContentText(body)
                   .setContentIntent(pi)
                   .setAutoCancel(true);
                  nm.notify((int) System.currentTimeMillis(), b.build());
              }
          }
          EOF
          else
            cat << 'EOF' > app/src/main/java/com/tulenchika/app/FcmHelper.java
          package com.tulenchika.app;
          public class FcmHelper {
              interface Cb { void done(String token, String err); }
              static void getToken(Cb cb) { cb.done(null, "FCM not configured"); }
          }
          EOF
          fi

          cat << 'EOF' > app/src/main/java/com/tulenchika/app/PushBridge.java
          package com.tulenchika.app;
          import android.webkit.JavascriptInterface;
          import org.json.JSONObject;
          public class PushBridge {
              private final MainActivity act;
              PushBridge(MainActivity a) { act = a; }
              @JavascriptInterface
              public boolean hasPermission() { return act.hasNotifPermission(); }
              @JavascriptInterface
              public void requestPermission() { act.runOnUiThread(() -> act.requestNotifPermission()); }
              @JavascriptInterface
              public void requestToken() {
                  FcmHelper.getToken((tok, err) -> act.runJs("window.__fcmCb && window.__fcmCb("
                      + (tok == null ? "null" : JSONObject.quote(tok)) + ","
                      + (err == null ? "null" : JSONObject.quote(err)) + ")"));
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/tulenchika/app/MainActivity.java
          package com.tulenchika.app;
          import android.Manifest;
          import android.app.Activity;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              private static final int FILE_REQ = 1;
              private static final int PERM_REQ = 2;
              private WebView webView;
              private LinearLayout errorLayout;
              private ValueCallback<Uri[]> filePathCallback;
              private final String url = "file:///android_asset/index.html";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      nm.createNotificationChannel(new NotificationChannel("chat", "Чат", NotificationManager.IMPORTANCE_HIGH));
                  }
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  webView.addJavascriptInterface(new PushBridge(this), "AndroidPush");
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          try {
                              startActivityForResult(params.createIntent(), FILE_REQ);
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if ("file".equals(u.getScheme())) return false;
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception ignored) {}
                          return true;
                      }
                      @Override
                      public void onPageFinished(WebView view, String u) {
                          webView.setVisibility(View.VISIBLE);
                          errorLayout.setVisibility(View.GONE);
                      }
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              webView.setVisibility(View.GONE);
                              errorLayout.setVisibility(View.VISIBLE);
                          }
                      }
                  });
                  root.addView(webView, new LinearLayout.LayoutParams(-1, -1));
                  errorLayout = new LinearLayout(this);
                  errorLayout.setOrientation(LinearLayout.VERTICAL);
                  errorLayout.setGravity(Gravity.CENTER);
                  errorLayout.setBackgroundColor(Color.parseColor("#F5F5F5"));
                  errorLayout.setVisibility(View.GONE);
                  TextView title = new TextView(this);
                  title.setText("Ошибка загрузки");
                  title.setTextSize(20);
                  title.setGravity(Gravity.CENTER);
                  errorLayout.addView(title);
                  Button retryBtn = new Button(this);
                  retryBtn.setText("Попробовать Снова");
                  retryBtn.setOnClickListener(v -> {
                      errorLayout.setVisibility(View.GONE);
                      webView.setVisibility(View.VISIBLE);
                      webView.loadUrl(url);
                  });
                  errorLayout.addView(retryBtn);
                  root.addView(errorLayout, new LinearLayout.LayoutParams(-1, -1));
                  setContentView(root);
                  webView.loadUrl(url);
              }

              public boolean hasNotifPermission() {
                  if (Build.VERSION.SDK_INT < 33) return true;
                  return checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED;
              }

              public void requestNotifPermission() {
                  if (hasNotifPermission()) {
                      runJs("window.__permCb && window.__permCb(true)");
                  } else {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, PERM_REQ);
                  }
              }

              public void runJs(String js) {
                  runOnUiThread(() -> webView.evaluateJavascript(js, null));
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(code, perms, results);
                  if (code == PERM_REQ) {
                      boolean ok = results.length > 0 && results[0] == PackageManager.PERMISSION_GRANTED;
                      runJs("window.__permCb && window.__permCb(" + ok + ")");
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_REQ && filePathCallback != null) {
                      filePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

          mkdir -p app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">Чат Тюленчика</string></resources>' > app/src/main/res/values/strings.xml

      - name: Build APK
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KS_KEY_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KS_PATH="$RUNNER_TEMP/release.jks"
            gradle assembleRelease --no-daemon
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::Секреты подписи не заданы, собирается debug-версия"
            gradle assembleDebug --no-daemon
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Чат Тюленчика (сборка ${{ github.run_number }})
          files: ${{ env.APK_PATH }}
