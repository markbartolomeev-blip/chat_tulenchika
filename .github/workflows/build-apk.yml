name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Prepare files
        run: |
          test -f index.html || { echo "index.html не найден в корне репозитория"; exit 1; }
          mkdir -p app/src/main/assets
          rsync -a --exclude='.git' --exclude='.github' --exclude='app' ./ app/src/main/assets/
          ls -la app/src/main/assets

      - name: Generate Android Project
        run: |
          echo 'rootProject.name = "ChatTulenchika"' > settings.gradle
          echo 'include ":app"' >> settings.gradle

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.tulenchika.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tulenchika.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Chat Tulenchika"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/java/com/tulenchika/app
          cat << 'EOF' > app/src/main/java/com/tulenchika/app/MainActivity.java
          package com.tulenchika.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.graphics.Color;
          import android.view.Gravity;
          public class MainActivity extends Activity {
              private WebView webView;
              private LinearLayout errorLayout;
              private String url = "file:///android_asset/index.html";
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          webView.setVisibility(View.VISIBLE);
                          errorLayout.setVisibility(View.GONE);
                      }
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              webView.setVisibility(View.GONE);
                              errorLayout.setVisibility(View.VISIBLE);
                          }
                      }
                  });
                  root.addView(webView, new LinearLayout.LayoutParams(-1, -1));
                  errorLayout = new LinearLayout(this);
                  errorLayout.setOrientation(LinearLayout.VERTICAL);
                  errorLayout.setGravity(Gravity.CENTER);
                  errorLayout.setBackgroundColor(Color.parseColor("#F5F5F5"));
                  errorLayout.setVisibility(View.GONE);
                  TextView icon = new TextView(this);
                  icon.setText("🛜❌");
                  icon.setTextSize(50);
                  icon.setGravity(Gravity.CENTER);
                  errorLayout.addView(icon);
                  TextView title = new TextView(this);
                  title.setText("Ошибка загрузки.");
                  title.setTextSize(20);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 20, 0, 10);
                  errorLayout.addView(title);
                  TextView subtitle = new TextView(this);
                  subtitle.setText("Не удалось открыть приложение.\nПожалуйста, попробуйте снова");
                  subtitle.setTextSize(16);
                  subtitle.setGravity(Gravity.CENTER);
                  errorLayout.addView(subtitle);
                  Button retryBtn = new Button(this);
                  retryBtn.setText("Попробовать Снова");
                  LinearLayout.LayoutParams btnParams = new LinearLayout.LayoutParams(-2, -2);
                  btnParams.topMargin = 50;
                  retryBtn.setLayoutParams(btnParams);
                  retryBtn.setOnClickListener(v -> {
                      errorLayout.setVisibility(View.GONE);
                      webView.setVisibility(View.VISIBLE);
                      webView.loadUrl(url);
                  });
                  errorLayout.addView(retryBtn);
                  root.addView(errorLayout, new LinearLayout.LayoutParams(-1, -1));
                  setContentView(root);
                  webView.loadUrl(url);
              }
              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

          mkdir -p app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">Chat Tulenchika</string></resources>' > app/src/main/res/values/strings.xml

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chat--Tulenchika-APK
          path: app/build/outputs/apk/debug/app-debug.apk
