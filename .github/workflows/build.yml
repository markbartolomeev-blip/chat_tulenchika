name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/
          if [ -f manifest.json ]; then cp manifest.json app/src/main/assets/; fi
          if [ -f admin.html ]; then cp admin.html app/src/main/assets/; fi
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.tulenchika.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:icon="@android:drawable/sym_def_app_icon" android:label="Chat Tulenchika" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/com/tulenchika/app
          cat << 'EOF' > app/src/main/java/com/tulenchika/app/MainActivity.java
          package com.tulenchika.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.graphics.Color;
          import android.view.Gravity;
          public class MainActivity extends Activity {
              private WebView webView;
              private LinearLayout errorLayout;
              private String url = "https://markbartolomeev-blip.github.io/chat_tulenchika/";
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          webView.setVisibility(View.VISIBLE);
                          errorLayout.setVisibility(View.GONE);
                      }
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          webView.setVisibility(View.GONE);
                          errorLayout.setVisibility(View.VISIBLE);
                      }
                  });
                  root.addView(webView, new LinearLayout.LayoutParams(-1, -1));
                  errorLayout = new LinearLayout(this);
                  errorLayout.setOrientation(LinearLayout.VERTICAL);
                  errorLayout.setGravity(Gravity.CENTER);
                  errorLayout.setBackgroundColor(Color.parseColor("#F5F5F5"));
                  errorLayout.setVisibility(View.GONE);
                  TextView icon = new TextView(this);
                  icon.setText("🛜❌");
                  icon.setTextSize(50);
                  icon.setGravity(Gravity.CENTER);
                  errorLayout.addView(icon);
                  TextView title = new TextView(this);
                  title.setText("Отсутствует подключение к интернету.");
                  title.setTextSize(20);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, 20, 0, 10);
                  errorLayout.addView(title);
                  TextView subtitle = new TextView(this);
                  subtitle.setText("- Приложение не может\n- работать без Интернета.\nПожалуйста, проверьте подключение");
                  subtitle.setTextSize(16);
                  subtitle.setGravity(Gravity.CENTER);
                  errorLayout.addView(subtitle);
                  Button retryBtn = new Button(this);
                  retryBtn.setText("Попробовать Снова");
                  LinearLayout.LayoutParams btnParams = new LinearLayout.LayoutParams(-2, -2);
                  btnParams.topMargin = 50;
                  retryBtn.setLayoutParams(btnParams);
                  retryBtn.setOnClickListener(v -> {
                      errorLayout.setVisibility(View.GONE);
                      webView.setVisibility(View.VISIBLE);
                      webView.loadUrl(url);
                  });
                  errorLayout.addView(retryBtn);
                  root.addView(errorLayout, new LinearLayout.LayoutParams(-1, -1));
                  setContentView(root);
                  webView.loadUrl(url);
              }
              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">Chat Tulenchika</string></resources>' > app/src/main/res/values/strings.xml
          echo 'include ":app"' > settings.gradle
          echo 'buildscript { repositories { google(); mavenCentral() } dependencies { classpath "com.android.tools.build:gradle:8.1.1" } }' > build.gradle
          echo 'plugins { id "com.android.application" }' > app/build.gradle
          echo 'android { namespace "com.tulenchika.app"; compileSdk 34; defaultConfig { applicationId "com.tulenchika.app"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" } buildTypes { release { minifyEnabled false } } }' >> app/build.gradle
          echo 'dependencies { }' >> app/build.gradle
      - name: Build with Gradle
        run: |
          gradle wrapper
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tulenchika-APK
          path: app/build/outputs/apk/debug/app-debug.apk
