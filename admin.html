<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рассылка · Чат Тюленчика</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #eaf3fb; color: #0b3d74; margin: 0; padding: 24px; }
  .box { max-width: 460px; margin: 0 auto; background: #fff; border-radius: 22px; padding: 22px; box-shadow: 0 8px 22px rgba(5, 30, 70, .15); }
  h1 { font-size: 22px; margin: 0 0 14px; }
  label { display: block; font-weight: 700; margin: 12px 0 6px; }
  input, textarea { width: 100%; font: 16px system-ui, sans-serif; padding: 12px; border: 2px solid #b9d7f0; border-radius: 12px; box-sizing: border-box; }
  textarea { min-height: 110px; resize: vertical; }
  button { margin-top: 16px; width: 100%; padding: 14px; font: 700 17px system-ui, sans-serif; border: none; border-radius: 14px; background: #1a6fc4; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  #out { margin-top: 14px; font-weight: 700; min-height: 22px; }
  .hint { font-size: 13px; color: #557; margin-top: 6px; }
</style>
</head>
<body>
<div class="box">
  <h1>📣 Рассылка уведомлений</h1>

  <label for="key">Ключ администратора</label>
  <input type="password" id="key" autocomplete="off" placeholder="Секретное слово (ADMIN_KEY)">

  <label for="title">Заголовок</label>
  <input type="text" id="title" value="Чат Тюленчика" maxlength="80">

  <label for="body">Текст уведомления</label>
  <textarea id="body" maxlength="400" placeholder="Что написать подписчикам"></textarea>
  <div class="hint">Уведомление получат все, кто включил «Уведомления» в профиле.</div>

  <button id="send" type="button">Отправить всем</button>
  <div id="out"></div>
</div>

<script>
  const WORKER = 'https://tyulen-bot.markbartolomeev.workers.dev';
  const out = document.getElementById('out');
  document.getElementById('send').addEventListener('click', async () => {
    const btn = document.getElementById('send');
    const key = document.getElementById('key').value.trim();
    const title = document.getElementById('title').value.trim() || 'Чат Тюленчика';
    const body = document.getElementById('body').value.trim();
    if (!key) { out.style.color = '#c0392b'; out.textContent = 'Введите ключ администратора'; return; }
    if (!body) { out.style.color = '#c0392b'; out.textContent = 'Напишите текст'; return; }
    btn.disabled = true;
    out.style.color = '#0b3d74';
    out.textContent = 'Отправляем...';
    try {
      const res = await fetch(WORKER + '/push/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key, title, body }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        out.textContent = `✅ Отправлено: ${data.sent} из ${data.total}`;
      } else {
        out.style.color = '#c0392b';
        out.textContent = res.status === 403 ? '🔒 Неверный ключ' : '⚠️ ' + (data.error || 'Ошибка отправки');
      }
    } catch (_) {
      out.style.color = '#c0392b';
      out.textContent = '📡 Нет связи с сервером';
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
